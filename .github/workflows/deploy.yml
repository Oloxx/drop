name: Deploy to Production VPS

on:
  # A mano desde la pestaña Actions: para volver a desplegar `main` cuando el
  # push que tocaba producción se quedó sin desplegar (la puerta de tests
  # falló por una carrera y el arreglo llegó en un commit que no toca estas
  # rutas, como pasó con la v0.9.0).
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'public/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'package*.json'
      - 'Caddyfile'
      - '.github/workflows/deploy.yml'

jobs:
  # Los mismos tests que en CI, y el despliegue depende de ellos: el VPS hace
  # `git reset --hard origin/main`, asi que sin esta puerta un commit roto llega
  # a produccion y solo se descubre usandolo.
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Production
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # El dominio publico sale de una variable del repositorio. Escrito en el
          # script, cualquiera que bifurque el repo comprobaria la salud del
          # servidor de otro. Si no esta puesta, solo se comprueba por dentro del
          # contenedor.
          HEALTH_URL: ${{ vars.DROP_PUBLIC_URL }}
        with:
          host: ${{ secrets.DROP_HOST }}
          username: ${{ secrets.DROP_USER }}
          key: ${{ secrets.DROP_SSH_KEY }}
          envs: HEALTH_URL
          script: |
            set -e
            echo "==> Actualizando código en ~/drop..."
            cd ~/drop
            # El Caddyfile entra en el contenedor como bind-mount de UN FICHERO, y
            # eso ata el montaje al inode: `git reset --hard` escribe un fichero
            # nuevo y Caddy se queda sirviendo el contenido viejo para siempre. Hay
            # que recrear el contenedor, y un `up -d` a secas no lo hace porque su
            # definicion en el compose no ha cambiado. Paso de verdad con las
            # cabeceras de seguridad: se desplegaron y HSTS no llego a produccion.
            CADDY_ANTES=$(sha256sum Caddyfile | cut -d" " -f1)
            git fetch origin main
            git reset --hard origin/main
            CADDY_DESPUES=$(sha256sum Caddyfile | cut -d" " -f1)

            echo "==> Reconstruyendo contenedor Docker..."
            # El commit entra en la imagen: `/version` lo dice y `drop verify-web`
            # compara lo servido con ese commit del repositorio.
            export DROP_COMMIT=$(git rev-parse HEAD)
            docker compose up -d --build drop
            # coturn tambien: sus credenciales y sus flags salen del compose y del
            # .env, asi que un cambio ahi no llega a produccion si no se recrea.
            # `up -d` es idempotente, solo lo toca cuando su definicion ha cambiado.
            docker compose up -d coturn

            if [ "$CADDY_ANTES" != "$CADDY_DESPUES" ]; then
              echo "==> El Caddyfile ha cambiado: recreando Caddy..."
              docker compose up -d --force-recreate caddy
            fi

            echo "==> Comprobando estado del servicio..."
            sleep 3
            interno() {
              docker compose exec -T drop node -e "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1))"
            }
            if [ -n "$HEALTH_URL" ]; then
              curl -sf "$HEALTH_URL/healthz" || interno
            else
              interno
            fi
            echo "==> ¡Despliegue completado con éxito!"
