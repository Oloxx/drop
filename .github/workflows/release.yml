# Publica una release completa al empujar un tag `vX.Y.Z`.
#
#   npm version 0.4.1 && git push --follow-tags
#
# Cada binario se EJECUTA en su plataforma nativa antes de publicarse. No es
# ceremonia: la v0.4.0 se publico con los cinco ejecutables rotos porque el
# workflow solo comprobaba que los archivos existieran. Un binario que no se ha
# arrancado nunca no esta verificado, por muy verde que salga el job.

name: Release

on:
  push:
    tags:
      - 'v*'

# Sin esto, `gh release create` responde 403. Es el unico permiso que se amplia.
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- controles
  verificar:
    name: Tests y coherencia de version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # La version vive en dos sitios a mano (package.json y la constante
      # VERSION de cli/src/cli.js). Si divergen, `drop update` compara contra la
      # constante y los clientes no detectan la actualizacion, o la detectan en
      # bucle. Mientras eso no se arregle (issue #26), esto lo caza aqui.
      - name: Comprobar que el tag, package.json y cli.js coinciden
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          CLI=$(node -p "require('fs').readFileSync('cli/src/cli.js','utf8').match(/const VERSION = '([^']+)'/)[1]")
          echo "tag=$TAG  package.json=$PKG  cli.js=$CLI"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CLI" ]; then
            echo "::error::La version no coincide en los tres sitios. Corrige y vuelve a etiquetar."
            exit 1
          fi

      - run: npm ci

      # `test/signaling.test.mjs` se conecta a un servidor que espera ya
      # levantado. Hasta que la suite arranque el suyo (issue #23), se levanta
      # aqui y se espera a que /healthz responda.
      - name: Levantar el servidor de senializacion
        run: |
          node server/index.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/healthz && break
            sleep 1
          done

      - run: npm test

  # ------------------------------------------------------------------- macOS
  # Un runner por arquitectura, para poder EJECUTAR lo que se compila. macOS
  # necesita ademas `codesign`, que solo existe aqui: sin firma los binarios
  # arm64 ni arrancan.
  macos:
    name: macOS ${{ matrix.target }}
    needs: verificar
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest      # Apple Silicon
          # `macos-13` ya no existe: GitHub lo retiro y las imagenes vivas son
          # macOS 26, 15 y 14 (esta ultima deprecada). Un label retirado no falla,
          # se queda encolado esperando un runner que no va a aparecer nunca.
          - target: darwin-x64
            runner: macos-15-intel    # Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: node scripts/build-cross.mjs ${{ matrix.target }}

      - name: Comprobar firma y ejecutar el binario
        run: |
          BIN=$(ls dist/drop-v*-macos-* | grep -v '\.tar\.gz$')
          codesign --verify --verbose "$BIN"
          "$BIN" --version
          "$BIN" --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/drop-v*.tar.gz
          retention-days: 1

  # ------------------------------------------------------------------- Linux
  linux:
    name: Linux (x64 y arm64)
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npm run build:linux
      - run: npm run build:arm

      # El de arm64 no se puede ejecutar en un runner x64 sin emulacion, asi que
      # queda sin probar. Es la unica plataforma que se publica a ciegas.
      - name: Ejecutar el binario de x64
        run: |
          BIN=$(ls dist/drop-v*-linux-x64 | grep -v '\.tar\.gz$')
          chmod +x "$BIN"
          "$BIN" --version
          "$BIN" --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux
          path: dist/drop-v*.tar.gz
          retention-days: 1

  # ----------------------------------------------------------------- Windows
  windows:
    name: Windows x64
    needs: verificar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npm run build:exe

      - name: Ejecutar el binario
        run: |
          $bin = Get-ChildItem dist/drop-v*-windows-x64.exe | Select-Object -First 1
          & $bin.FullName --version
          & $bin.FullName --help | Out-Null

      - uses: actions/upload-artifact@v4
        with:
          name: bin-windows
          path: dist/drop-v*-windows-x64.exe
          retention-days: 1

  # ----------------------------------------------------------------- release
  publicar:
    name: Publicar la release
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      - name: Reunir los assets
        run: |
          mkdir -p dist
          find artefactos -type f \( -name 'drop-v*.tar.gz' -o -name 'drop-v*.exe' \) -exec mv {} dist/ \;
          ls -la dist
          # Cinco assets exactos: si falta uno, algo se perdio por el camino y es
          # mejor no publicar una release incompleta.
          COUNT=$(ls dist | wc -l)
          if [ "$COUNT" -ne 5 ]; then
            echo "::error::Se esperaban 5 binarios y hay $COUNT."
            exit 1
          fi

      # El SHA256SUMS lo verifica `drop update` antes de escribirse encima del
      # ejecutable en marcha. Nombres a secas, sin ruta.
      - name: Generar SHA256SUMS
        working-directory: dist
        run: |
          sha256sum drop-v* > SHA256SUMS
          cat SHA256SUMS

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/drop-v* \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
