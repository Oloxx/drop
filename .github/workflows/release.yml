# Publica una release completa al empujar un tag `vX.Y.Z`.
#
#   npm version 0.4.1 && git push --follow-tags
#
# Cada binario Rust se EJECUTA en su plataforma nativa antes de publicarse. No es
# ceremonia: un binario que no se ha arrancado nunca no esta verificado, por muy
# verde que salga la compilacion.

name: Release

on:
  push:
    tags:
      - 'v*'

# Sin esto, `gh release create` responde 403. Es el unico permiso que se amplia.
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- controles
  verificar:
    name: Tests y coherencia de version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli-rs

      # Comprueba que tag, package.json y cli-rs/Cargo.toml estan sincronizados.
      - name: Comprobar que tag, package.json y Cargo.toml coinciden
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(grep -m1 '^version' cli-rs/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$TAG  package.json=$PKG  Cargo.toml=$CARGO"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CARGO" ]; then
            echo "::error::Versiones desincronizadas (tag=$TAG, package.json=$PKG, Cargo.toml=$CARGO)."
            exit 1
          fi

      - run: npm ci
      - run: |
          cargo clippy --manifest-path cli-rs/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path cli-rs/Cargo.toml
          cargo build --release --manifest-path cli-rs/Cargo.toml

      # La suite levanta su propio servidor de senializacion (issue #23): aqui no
      # hay que preparar nada. Exigimos Chrome igual que en ci.yml para que
      # test/web.test.mjs no se salte en silencio al etiquetar una release.
      - run: npm test
        env:
          DROP_REQUIRE_CHROME: '1'

  # ------------------------------------------------------------------- macOS
  # Un runner por arquitectura, para poder EJECUTAR lo que se compila. macOS
  # necesita ademas `codesign` ad-hoc para Apple Silicon.
  macos:
    name: macOS ${{ matrix.target }}
    needs: verificar
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            rust_target: aarch64-apple-darwin
            runner: macos-latest      # Apple Silicon
          - target: macos-x64
            rust_target: x86_64-apple-darwin
            runner: macos-15-intel    # Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli-rs

      - run: cargo build --release --manifest-path cli-rs/Cargo.toml --target ${{ matrix.rust_target }}

      - name: Firmar, probar y empaquetar binario
        run: |
          VER=$(grep -m1 '^version' cli-rs/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          NAME="drop-v${VER}-${{ matrix.target }}"
          mkdir -p dist
          cp "cli-rs/target/${{ matrix.rust_target }}/release/drop" "dist/${NAME}"
          codesign --sign - --force "dist/${NAME}"
          codesign --verify --verbose "dist/${NAME}"
          "dist/${NAME}" --version
          "dist/${NAME}" --help > /dev/null
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/drop-v*.tar.gz
          retention-days: 1

  # ------------------------------------------------------------------- Linux
  # Compilacion estatica musl en runner nativo para cada arquitectura, sin
  # depender de la glibc del host.
  linux:
    name: Linux ${{ matrix.target }}
    needs: verificar
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            rust_target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: linux-arm64
            rust_target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli-rs

      - run: cargo build --release --manifest-path cli-rs/Cargo.toml --target ${{ matrix.rust_target }}

      - name: Probar y empaquetar binario
        run: |
          VER=$(grep -m1 '^version' cli-rs/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          NAME="drop-v${VER}-${{ matrix.target }}"
          mkdir -p dist
          cp "cli-rs/target/${{ matrix.rust_target }}/release/drop" "dist/${NAME}"
          chmod +x "dist/${NAME}"
          "dist/${NAME}" --version
          "dist/${NAME}" --help > /dev/null
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/drop-v*.tar.gz
          retention-days: 1

  # ----------------------------------------------------------------- Windows
  windows:
    name: Windows x64
    needs: verificar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli-rs

      - run: cargo build --release --manifest-path cli-rs/Cargo.toml

      - name: Probar y preparar binario
        run: |
          $ver = (Select-String -Path cli-rs/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $name = "drop-v$ver-windows-x64.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "cli-rs/target/release/drop.exe" "dist/$name"
          & "dist/$name" --version
          & "dist/$name" --help | Out-Null

      - uses: actions/upload-artifact@v4
        with:
          name: bin-windows
          path: dist/drop-v*-windows-x64.exe
          retention-days: 1

  # ----------------------------------------------------------------- release
  publicar:
    name: Publicar la release
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      # El repositorio hace falta aqui para firmar: el firmador y la clave
      # publica contra la que se comprueba salen del propio codigo.
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      - name: Reunir los assets
        run: |
          mkdir -p dist
          find artefactos -type f \( -name 'drop-v*.tar.gz' -o -name 'drop-v*.exe' \) -exec mv {} dist/ \;
          ls -la dist
          # Cinco assets exactos: si falta uno, algo se perdio por el camino y es
          # mejor no publicar una release incompleta.
          COUNT=$(ls dist | wc -l)
          if [ "$COUNT" -ne 5 ]; then
            echo "::error::Se esperaban 5 binarios y hay $COUNT."
            exit 1
          fi

      # El SHA256SUMS lo verifica `drop update` antes de escribirse encima del
      # ejecutable en marcha. Nombres a secas, sin ruta.
      - name: Generar SHA256SUMS
        working-directory: dist
        run: |
          sha256sum drop-v* > SHA256SUMS
          cat SHA256SUMS

      # La firma cubre el SHA256SUMS y, a traves de el, los cinco binarios: el
      # hash dice que el binario llego entero, la firma dice quien lo publico.
      # Sin el secret la release se para: una release sin firmar no la instalaria
      # `drop update` sin --allow-unsigned, y es mejor enterarse aqui.
      - name: Firmar el SHA256SUMS
        env:
          DROP_SIGNING_KEY: ${{ secrets.DROP_SIGNING_KEY }}
        run: |
          if [ -z "$DROP_SIGNING_KEY" ]; then
            echo "::error::Falta el secret DROP_SIGNING_KEY. Generalo con 'node scripts/keygen.mjs'."
            exit 1
          fi
          node repo/scripts/sign-release.mjs dist/SHA256SUMS
          cat dist/SHA256SUMS.minisig

      # Comprobacion cruzada con el minisign de verdad: nuestro firmador escribe
      # el formato a mano, y un fallo ahi no se notaria hasta que alguien
      # intentase verificar una descarga siguiendo el README.
      - name: Verificar la firma con minisign
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          PUBKEY=$(grep -o "RW[A-Za-z0-9+/=]\{40,\}" repo/cli-rs/src/cli.rs | head -1)
          echo "clave publica del CLI: $PUBKEY"
          minisign -V -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig -P "$PUBKEY"

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/drop-v* \
            dist/SHA256SUMS \
            dist/SHA256SUMS.minisig \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
