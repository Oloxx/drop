# Configuracion de despliegue para Fly.io.
# Cambia `app` por un nombre libre (debe ser unico en todo Fly) y `primary_region`
# por la region mas cercana a ti y a tus amigos: mad (Madrid), cdg (Paris), lhr (Londres).

app = "drop-cambia-esto"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true            # sin HTTPS no hay portapapeles ni escritura directa a disco
  auto_start_machines = true
  auto_stop_machines = "stop"

  # IMPORTANTE: las salas viven en la memoria del proceso. Con dos maquinas, el
  # emisor podria caer en una y el receptor en la otra, y el enlace daria "caducado".
  # Una sola maquina, siempre encendida: si se apagara, se llevaria las salas abiertas.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"              # de sobra: los archivos no pasan por aqui
