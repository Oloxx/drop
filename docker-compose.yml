# Pila completa para un VPS: la app + HTTPS automatico + TURN propio.
# Copia .env.example a .env y rellenalo antes de levantar esto.
#
#   docker compose up -d --build
#
# Ver DEPLOY-VPS.md para los puertos que hay que abrir (en Oracle son DOS sitios).

services:
  drop:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: "3000"
      # Sin esto, el servidor no sabe desde que dominio se le habla y rechaza el
      # WebSocket del navegador por Origin (ver server/index.js).
      DROP_DOMAIN: "${DROP_DOMAIN}"
      DROP_ALLOWED_ORIGINS: "${DROP_ALLOWED_ORIGINS:-}"
      # El cliente recibe esto desde /config y lo usa como TURN. Las credenciales
      # no van aqui: el servidor las firma al vuelo con TURN_SECRET y caducan.
      TURN_URL: "turn:${DROP_DOMAIN}:3478"
      TURN_SECRET: "${TURN_SECRET}"
      TURN_TTL_SECONDS: "${TURN_TTL_SECONDS:-43200}"
      # Caudal del relay (ver .env.example). Vacio = sin limite.
      DROP_RELAY_LIMIT: "${DROP_RELAY_LIMIT:-}"
      DROP_RELAY_LIMIT_TOTAL: "${DROP_RELAY_LIMIT_TOTAL:-}"

  # Caddy saca y renueva el certificado de Let's Encrypt solo, y proxea
  # WebSockets sin configuracion extra.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DROP_DOMAIN: "${DROP_DOMAIN}"
    depends_on:
      - drop

  # TURN: el reenvio para el 10-15% de conexiones que no logran hablar directas.
  # network_mode host porque necesita un rango de puertos UDP para los relays.
  coturn:
    image: coturn/coturn:4
    restart: unless-stopped
    network_mode: host
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--realm=${DROP_DOMAIN}"
      # Autenticacion por secreto compartido (el mecanismo REST): coturn acepta
      # usuarios que llevan dentro su caducidad y vienen firmados con este
      # secreto, en vez de un usuario y contrasena fijos que valdrian para
      # siempre a quien los pillase de /config. El --realm es obligatorio con el.
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET}"
      # Oracle da IP publica por NAT 1:1, asi que hay que decirle las dos.
      - "--external-ip=${PUBLIC_IP}/${PRIVATE_IP}"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--no-multicast-peers"
      # Sin certificados no montamos listeners TLS; el trafico ya va cifrado por DTLS.
      # (El CLI de coturn viene apagado por defecto, no hace falta desactivarlo.)
      - "--no-tls"

volumes:
  caddy_data:
  caddy_config:
